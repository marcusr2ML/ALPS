name: Contribution judge

# Runs on every pull request that touches contributions/, and passes only if the
# overall rate meets the threshold in contributions/harness/judge.sh. Whether
# the PR stayed inside contributions/submission/ is checked separately by
# contributions-scope.yml, which a PR cannot edit. Nothing is filed here:
# contributions-file.yml does that once the PR is merged.
on:
  pull_request:
    paths:
      - 'contributions/**'
      - '.github/workflows/contributions-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find submission
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)
          else
            changed=$(git ls-files contributions/submission)
          fi
          echo "Changed files:"; echo "$changed"

          if ! echo "$changed" | grep -q '^contributions/submission/'; then
            echo "has_submission=false" >> "$GITHUB_OUTPUT"
            echo "No submission in this change; judging the examples against the harness instead."
            exit 0
          fi
          echo "has_submission=true" >> "$GITHUB_OUTPUT"

      - name: Judge submission
        if: steps.scope.outputs.has_submission == 'true'
        run: |
          set +e
          bash contributions/harness/judge.sh "$RUNNER_TEMP/judge"
          status=$?
          set -e
          if [ -f "$RUNNER_TEMP/judge/report.md" ]; then
            { echo "## Contribution: $(cat "$RUNNER_TEMP/judge/name" 2>/dev/null)"; echo
              cat "$RUNNER_TEMP/judge/report.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      # A change to the harness itself (no submission) must still accept every
      # example, one per contract.
      - name: Judge examples
        if: steps.scope.outputs.has_submission == 'false'
        run: |
          status=0
          for ex in contributions/examples/*/; do
            out="$RUNNER_TEMP/examples/$(basename "$ex")"
            if ! bash contributions/harness/judge.sh "$out" "$ex"; then
              echo "::error::example $(basename "$ex") is no longer accepted"
              status=1
            fi
            if [ -f "$out/report.md" ]; then
              { echo "## Example: $(basename "$ex")"; echo; cat "$out/report.md"; echo; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit $status
